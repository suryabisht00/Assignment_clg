<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Hover Effect</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Hover Effect Demo</h1>
    <p>Hover over the images to see the effects - first image becomes colorful, second image becomes grayscale</p>
    
    <div class="image-container">
        <div class="image-wrapper">
            <img src="https://picfiles.alphacoders.com/390/390975.jpg" alt="Nature Image" class="hover-image">
        </div>
        <div class="image-wrapper">
            <img src="https://th.bing.com/th/id/R.b57dad25c2cd64110af00271fa7c2cac?rik=2BAimcNst6813Q&riu=http%3a%2f%2fgetwallpapers.com%2fwallpaper%2ffull%2f5%2f1%2fb%2f927134-shin-chan-wallpapers-1920x1080-for-phones.jpg&ehk=%2fBHK%2bxk774e9pwa4m%2f22AztF3JwiC0hy%2fXqfcKyi4Wc%3d&risl=&pid=ImgRaw&r=0" alt="City Image" class="reverse-hover-image">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
